version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Skip releases younger than 5 days; compromised versions are usually
    # pulled from the registry within hours.
    cooldown:
      default-days: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    # Node majors are a deliberate choice: odd versions never become LTS and
    # go end-of-life after ~8 months. Move to the next even LTS by hand.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
